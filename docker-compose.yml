services:
  db:
    image: postgres:16-alpine
    container_name: zuari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zuari
      POSTGRES_PASSWORD: zuari
      POSTGRES_DB: zuari
    ports:
      - "5434:5432"
    volumes:
      - zuari-pgdata:/var/lib/postgresql/data
volumes:
  zuari-pgdata:
